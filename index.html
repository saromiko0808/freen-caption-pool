 const group=(label)=>{const section=document.createElement('div');const title=document.createElement('span');title.className='tag-group-label';title.textContent=label;section.appendChild(title);root.appendChild(section);return section};
 const keyword=group('KEYWORD');const keywordText=document.createElement('div');keywordText.className='tag-keyword';keywordText.textContent=CAMPAIGN.keyword;keyword.appendChild(keywordText);
 const hashtagGroup=group('HASHTAGS · USE IN THIS ORDER');const hashtagList=document.createElement('div');hashtagList.className='tag-chip-list';CAMPAIGN.hashtags.forEach(tag=>{const chip=document.createElement('span');chip.className='tag-chip';chip.textContent=tag;hashtagList.appendChild(chip)});hashtagGroup.appendChild(hashtagList);
 const xGroup=group('X');const xLine=document.createElement('div');xLine.className='tag-account-line';xLine.textContent=CAMPAIGN.xTags.join('\n');xGroup.appendChild(xLine);
 const igGroup=group('INSTAGRAM');const igLine=document.createElement('div');igLine.className='tag-account-line';igLine.textContent=CAMPAIGN.instagramTags.join('\n');igGroup.appendChild(igLine);
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(!b)return;kind=b.dataset.kind;currentIndex=-1;document.querySelectorAll('[data-kind]').forEach(t=>{const active=t===b;t.classList.toggle('active',active);t.setAttribute('aria-selected',String(active))});choose()});
$('another').addEventListener('click',choose);$('copyEnglish').addEventListener('click',()=>currentItem&&copyText(currentItem.en,'已複製英文'));$('copyChinese').addEventListener('click',()=>currentItem&&copyText(currentItem.zh,'已複製中文'));
document.querySelectorAll('[data-platform]').forEach(b=>b.addEventListener('click',()=>copyText(campaignText(b.dataset.platform),`已複製${b.dataset.platform==='x'?'X':'Instagram'}完整貼文`)));
renderTags();choose();
</script>
</body></html>
